  <style>
    .menu-button {
      transform-box: fill-box;
      transform-origin: center;
      animation: button-bob 2.8s ease-in-out infinite;
    }
    .menu-button:nth-of-type(2) { animation-delay: -.55s; }
    .menu-button:nth-of-type(3) { animation-delay: -1.1s; }
    .menu-button:nth-of-type(4) { animation-delay: -1.65s; }
    @keyframes button-bob {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3px) scale(1.012); }
    }
    @media (prefers-reduced-motion: reduce) {
      .menu-button { animation: none; }
    }
  </style>

