<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d17">
  <title>贪吃蛇 · Neon Snake</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080d17;
      --panel: #101827;
      --panel-light: #162235;
      --text: #edf5ff;
      --muted: #8998ae;
      --green: #a6ff5f;
      --cyan: #54e6d2;
      --line: rgba(167, 194, 224, .12);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(37, 81, 95, .18), transparent 52%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    .game {
      width: min(100%, 760px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(166, 255, 95, .24);
      border-radius: 13px;
      background: rgba(166, 255, 95, .08);
      color: var(--green);
      font-size: 22px;
      box-shadow: 0 0 26px rgba(166, 255, 95, .08);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 750;
      letter-spacing: .02em;
    }

    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
    }

    .top-actions { display: flex; gap: 8px; }

    .icon-button, .action-button {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(16, 24, 39, .9);
      color: var(--text);
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }

    .icon-button:hover, .action-button:hover {
      border-color: rgba(166, 255, 95, .4);
      background: var(--panel-light);
    }

    .icon-button:active, .action-button:active { transform: translateY(1px); }
    .icon-button:focus-visible, .action-button:focus-visible, .dpad button:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 3px;
    }

    .score-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat {
      min-height: 68px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(16, 24, 39, .8);
    }

    .stat-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .1em;
    }

    .stat-value { font-size: 21px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .stat.current .stat-value { color: var(--green); }
    .stat.level .stat-value { color: var(--cyan); }

    .board-shell {
      position: relative;
      width: min(100%, calc(100vh - 270px));
      margin-inline: auto;
      padding: 10px;
      overflow: hidden;
      border: 1px solid rgba(163, 188, 218, .16);
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(25, 39, 58, .95), rgba(11, 18, 30, .98));
      box-shadow: 0 24px 70px rgba(0, 0, 0, .36), 0 0 50px rgba(67, 221, 196, .04);
    }

    .board-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 10px;
      background: #0a111d;
      touch-action: none;
    }

    canvas { display: block; width: 100%; height: 100%; }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(5, 10, 18, .65);
      backdrop-filter: blur(5px);
      text-align: center;
      transition: opacity .2s ease, visibility .2s ease;
    }

    .overlay.hidden { visibility: hidden; opacity: 0; pointer-events: none; }

    .overlay-card { max-width: 330px; }

    .overlay-icon {
      display: grid;
      width: 58px;
      height: 58px;
      margin: 0 auto 16px;
      place-items: center;
      border: 1px solid rgba(166, 255, 95, .25);
      border-radius: 18px;
      background: rgba(166, 255, 95, .1);
      color: var(--green);
      font-size: 28px;
      box-shadow: 0 0 35px rgba(166, 255, 95, .13);
    }

    .overlay h2 { margin: 0 0 8px; font-size: clamp(22px, 5vw, 30px); }
    .overlay p { margin: 0 0 20px; color: #aab7c9; line-height: 1.7; font-size: 14px; }

    .primary-button {
      min-height: 46px;
      padding: 0 22px;
      border: 0;
      border-radius: 12px;
      background: var(--green);
      color: #13200e;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(166, 255, 95, .16);
      transition: transform .18s ease, filter .18s ease;
    }

    .primary-button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .primary-button:focus-visible { outline: 2px solid white; outline-offset: 3px; }

    .bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
    }

    .keys { display: flex; align-items: center; gap: 5px; }

    kbd {
      display: inline-grid;
      min-width: 25px;
      height: 24px;
      place-items: center;
      padding: 0 6px;
      border: 1px solid rgba(167, 194, 224, .16);
      border-radius: 6px;
      background: rgba(22, 34, 53, .8);
      color: #c1ccdb;
      font-family: inherit;
      font-size: 11px;
    }

    .dpad {
      display: none;
      grid-template-columns: repeat(3, 42px);
      grid-template-rows: repeat(2, 38px);
      justify-content: center;
      gap: 5px;
      margin-top: 14px;
    }

    .dpad button {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .dpad button[data-dir="up"] { grid-column: 2; }
    .dpad button[data-dir="left"] { grid-column: 1; grid-row: 2; }
    .dpad button[data-dir="down"] { grid-column: 2; grid-row: 2; }
    .dpad button[data-dir="right"] { grid-column: 3; grid-row: 2; }

    @media (max-width: 540px) {
      body { padding: 10px 14px; align-items: center; }
      .topbar { margin-bottom: 14px; }
      .brand-mark { width: 38px; height: 38px; }
      h1 { font-size: 16px; }
      .subtitle { font-size: 10px; }
      .icon-button { min-height: 38px; padding: 0 10px; }
      .music-button span { display: none; }
      .score-row { gap: 7px; }
      .stat { min-height: 62px; padding: 10px 11px; }
      .stat-value { font-size: 19px; }
      .stat-label { font-size: 10px; }
      .board-shell {
        width: min(100%, calc(100vh - 320px));
        padding: 7px;
        border-radius: 14px;
      }
      .bottom-row { align-items: flex-start; flex-direction: column; gap: 8px; }
      .dpad { display: grid; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="game">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">↗</div>
        <div>
          <h1>贪吃蛇</h1>
          <p class="subtitle">NEON SNAKE · CLASSIC ARCADE</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="pauseButton" type="button" aria-label="暂停游戏" title="暂停 / 继续 (Esc 或空格)">Ⅱ <span>暂停</span></button>
        <button class="icon-button music-button" id="musicButton" type="button" aria-label="关闭背景音乐" aria-pressed="true" title="开关背景音乐">♫ <span>音乐开</span></button>
        <button class="icon-button" id="restartButton" type="button" aria-label="重新开始" title="重新开始">↻ <span>重开</span></button>
      </div>
    </header>

    <section class="score-row" aria-label="游戏数据">
      <div class="stat current"><span class="stat-label">当前得分</span><span class="stat-value" id="score">000</span></div>
      <div class="stat"><span class="stat-label">最高纪录</span><span class="stat-value" id="best">000</span></div>
      <div class="stat level"><span class="stat-label">当前速度</span><span class="stat-value" id="speed">1 级</span></div>
    </section>

    <section class="board-shell" aria-label="贪吃蛇游戏区域">
      <div class="board-wrap" id="boardWrap">
        <canvas id="gameCanvas" width="600" height="600" role="img" aria-label="贪吃蛇游戏棋盘"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay-card">
            <div class="overlay-icon" id="overlayIcon" aria-hidden="true">▶</div>
            <h2 id="overlayTitle">准备好了吗？</h2>
            <p id="overlayText">吃掉发光果实，让蛇蛇变长。<br>别撞到墙，也别咬到自己哦！</p>
            <button class="primary-button" id="startButton" type="button">开始游戏</button>
          </div>
        </div>
      </div>
    </section>

    <div class="bottom-row">
      <div class="keys"><span>移动</span> <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd><span>或</span> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div>
      <span>Esc / 空格键暂停 · 手机可滑动或使用方向键</span>
    </div>
    <div class="dpad" aria-label="触屏方向控制">
      <button type="button" data-dir="up" aria-label="向上">▲</button>
      <button type="button" data-dir="left" aria-label="向左">◀</button>
      <button type="button" data-dir="down" aria-label="向下">▼</button>
      <button type="button" data-dir="right" aria-label="向右">▶</button>
    </div>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const overlay = document.getElementById("overlay");
      const overlayIcon = document.getElementById("overlayIcon");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const startButton = document.getElementById("startButton");
      const pauseButton = document.getElementById("pauseButton");
      const musicButton = document.getElementById("musicButton");
      const scoreElement = document.getElementById("score");
      const bestElement = document.getElementById("best");
      const speedElement = document.getElementById("speed");

      const cells = 24;
      const cellSize = canvas.width / cells;
      const backgroundCanvas = document.createElement("canvas");
      backgroundCanvas.width = canvas.width;
      backgroundCanvas.height = canvas.height;
      const backgroundContext = backgroundCanvas.getContext("2d");
      const directions = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };
      const keyDirections = {
        ArrowUp: "up", w: "up", W: "up",
        ArrowDown: "down", s: "down", S: "down",
        ArrowLeft: "left", a: "left", A: "left",
        ArrowRight: "right", d: "right", D: "right"
      };

      let snake;
      let previousSnake = [];
      let food;
      let direction;
      let nextDirection;
      let score = 0;
      let best = loadBest();
      let state = "ready";
      let lastTime = 0;
      let accumulator = 0;
      let touchStart = null;
      let musicEnabled = true;
      let audioContext = null;
      let musicGain = null;
      let musicTimer = null;
      let musicStep = 0;
      let musicStarting = false;

      bestElement.textContent = formatScore(best);
      drawBackground();
      resetBoard();
      draw();

      function loadBest() {
        try {
          return Number(localStorage.getItem("neon-snake-best")) || 0;
        } catch (error) {
          console.warn("无法读取本地最高分记录。", error);
          return 0;
        }
      }

      function saveBest() {
        try {
          localStorage.setItem("neon-snake-best", String(best));
        } catch (error) {
          console.warn("无法保存本地最高分记录。", error);
        }
      }

      function formatScore(value) {
        return String(value).padStart(3, "0");
      }

      function resetBoard() {
        snake = [{ x: 11, y: 12 }, { x: 10, y: 12 }, { x: 9, y: 12 }];
        previousSnake = snake.map((segment) => ({ ...segment }));
        direction = directions.right;
        nextDirection = directions.right;
        score = 0;
        placeFood();
        updateStats();
      }

      function placeFood() {
        const emptyCells = [];
        for (let y = 0; y < cells; y += 1) {
          for (let x = 0; x < cells; x += 1) {
            if (!snake.some((segment) => segment.x === x && segment.y === y)) {
              emptyCells.push({ x, y });
            }
          }
        }
        food = emptyCells[Math.floor(Math.random() * emptyCells.length)];
      }

      function updateStats() {
        scoreElement.textContent = formatScore(score);
        bestElement.textContent = formatScore(best);
        speedElement.textContent = `${Math.min(10, 1 + Math.floor(score / 5))} 级`;
      }

      function showOverlay(icon, title, text, buttonText) {
        overlayIcon.textContent = icon;
        overlayTitle.textContent = title;
        overlayText.innerHTML = text;
        startButton.textContent = buttonText;
        overlay.classList.remove("hidden");
      }

      function hideOverlay() {
        overlay.classList.add("hidden");
      }

      function startGame() {
        if (state === "over") resetBoard();
        previousSnake = snake.map((segment) => ({ ...segment }));
        state = "running";
        accumulator = 0;
        lastTime = 0;
        hideOverlay();
        updatePauseButton();
        syncMusic();
        requestAnimationFrame(gameLoop);
      }

      function togglePause() {
        if (state === "ready" || state === "over") {
          startGame();
          return;
        }
        if (state === "running") {
          state = "paused";
          stopMusic();
          showOverlay("Ⅱ", "游戏已暂停", "休息一下，准备好后继续。", "继续游戏");
        } else {
          startGame();
        }
        updatePauseButton();
      }

      function updatePauseButton() {
        const paused = state === "paused";
        pauseButton.innerHTML = paused ? "▶ <span>继续</span>" : "Ⅱ <span>暂停</span>";
        pauseButton.setAttribute("aria-label", paused ? "继续游戏" : "暂停游戏");
      }

      function updateMusicButton() {
        musicButton.innerHTML = musicEnabled ? "♫ <span>音乐开</span>" : "♫ <span>音乐关</span>";
        musicButton.setAttribute("aria-label", musicEnabled ? "关闭背景音乐" : "开启背景音乐");
        musicButton.setAttribute("aria-pressed", String(musicEnabled));
      }

      function syncMusic() {
        if (musicEnabled && state === "running") {
          startMusic();
        } else {
          stopMusic();
        }
      }

      function startMusic() {
        if (!musicEnabled || state !== "running" || musicTimer !== null || musicStarting) return;
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) throw new Error("此浏览器不支持 Web Audio API。");
          audioContext = audioContext || new AudioContextClass();
          if (!musicGain) {
            musicGain = audioContext.createGain();
            musicGain.gain.value = 0.7;
            musicGain.connect(audioContext.destination);
          }
          musicStarting = true;
          audioContext.resume().then(() => {
            musicStarting = false;
            if (!musicEnabled || state !== "running" || musicTimer !== null) return;
            musicStep = 0;
            playMusicNote();
            musicTimer = window.setInterval(playMusicNote, 320);
          }).catch((error) => {
            musicStarting = false;
            console.error("无法播放背景音乐。", error);
            musicEnabled = false;
            updateMusicButton();
          });
        } catch (error) {
          musicStarting = false;
          console.error("无法初始化背景音乐。", error);
          musicEnabled = false;
          updateMusicButton();
        }
      }

      function playMusicNote() {
        if (!audioContext || audioContext.state !== "running") return;
        const melody = [60, 64, 67, 72, 67, 64, 59, 62, 67, 71, 74, 71, 57, 60, 64, 69, 64, 60, 55, 59, 62, 67, 62, 59];
        const now = audioContext.currentTime;
        playTone(melody[musicStep % melody.length], "triangle", 0.16, now, 0.29);
        if (musicStep % 4 === 0) {
          const roots = [48, 47, 45, 43, 48, 47, 45, 43];
          const root = roots[Math.floor(musicStep / 4) % roots.length];
          playTone(root, "sine", 0.1, now, 1.05);
          playTone(root + 7, "sine", 0.045, now, 0.85);
        }
        musicStep += 1;
      }

      function playTone(note, type, volume, startTime, duration) {
        const oscillator = audioContext.createOscillator();
        const envelope = audioContext.createGain();
        oscillator.type = type;
        oscillator.frequency.value = 440 * Math.pow(2, (note - 69) / 12);
        envelope.gain.setValueAtTime(0.0001, startTime);
        envelope.gain.exponentialRampToValueAtTime(volume, startTime + 0.025);
        envelope.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
        oscillator.connect(envelope);
        envelope.connect(musicGain);
        oscillator.start(startTime);
        oscillator.stop(startTime + duration + 0.02);
      }

      function stopMusic() {
        if (musicTimer !== null) {
          window.clearInterval(musicTimer);
          musicTimer = null;
        }
        if (audioContext && audioContext.state === "running") {
          audioContext.suspend().catch((error) => {
            console.error("无法暂停背景音乐。", error);
          });
        }
      }

      function setDirection(name) {
        const candidate = directions[name];
        if (!candidate) return;
        if (state === "ready") startGame();
        if (state !== "running") return;
        if (candidate.x === -direction.x && candidate.y === -direction.y) return;
        nextDirection = candidate;
      }

      function step() {
        direction = nextDirection;
        previousSnake = snake.map((segment) => ({ ...segment }));
        const head = {
          x: snake[0].x + direction.x,
          y: snake[0].y + direction.y
        };
        const eating = head.x === food.x && head.y === food.y;
        const bodyToCheck = eating ? snake : snake.slice(0, -1);

        if (
          head.x < 0 || head.x >= cells || head.y < 0 || head.y >= cells ||
          bodyToCheck.some((segment) => segment.x === head.x && segment.y === head.y)
        ) {
          endGame();
          return;
        }

        snake.unshift(head);
        if (eating) {
          score += 1;
          if (score > best) {
            best = score;
            saveBest();
          }
          if (snake.length === cells * cells) {
            updateStats();
            state = "over";
            stopMusic();
            showOverlay("✦", "完美通关！", `你填满了整个棋盘，得分 <strong>${score}</strong>！`, "再玩一次");
            updatePauseButton();
            return;
          }
          placeFood();
          updateStats();
        } else {
          snake.pop();
        }
      }

      function endGame() {
        state = "over";
        stopMusic();
        showOverlay("↻", "游戏结束", `本次得分 <strong>${score}</strong>，再来挑战一次吧！`, "重新开始");
        updatePauseButton();
      }

      function gameLoop(timestamp) {
        if (state !== "running") return;
        if (!lastTime) lastTime = timestamp;
        accumulator += Math.min(timestamp - lastTime, 100);
        lastTime = timestamp;
        const interval = Math.max(65, 145 - Math.floor(score / 5) * 8);
        while (accumulator >= interval && state === "running") {
          step();
          accumulator -= interval;
        }
        draw(accumulator / interval);
        if (state === "running") requestAnimationFrame(gameLoop);
      }

      function drawBackground() {
        backgroundContext.fillStyle = "#0a111d";
        backgroundContext.fillRect(0, 0, canvas.width, canvas.height);
        backgroundContext.strokeStyle = "rgba(142, 169, 201, .055)";
        backgroundContext.lineWidth = 1;
        for (let i = 0; i <= cells; i += 1) {
          const position = i * cellSize + .5;
          backgroundContext.beginPath();
          backgroundContext.moveTo(position, 0);
          backgroundContext.lineTo(position, canvas.height);
          backgroundContext.stroke();
          backgroundContext.beginPath();
          backgroundContext.moveTo(0, position);
          backgroundContext.lineTo(canvas.width, position);
          backgroundContext.stroke();
        }
      }

      function draw(progress = 0) {
        ctx.drawImage(backgroundCanvas, 0, 0);

        if (food) {
          const centerX = food.x * cellSize + cellSize / 2;
          const centerY = food.y * cellSize + cellSize / 2;
          ctx.save();
          ctx.shadowColor = "#ff7188";
          ctx.shadowBlur = 18;
          ctx.fillStyle = "#ff7188";
          ctx.beginPath();
          ctx.arc(centerX, centerY, cellSize * .31, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = "#ffd2d8";
          ctx.beginPath();
          ctx.arc(centerX - 2, centerY - 2, cellSize * .1, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        snake.forEach((segment, index) => {
          const previous = previousSnake[Math.min(index, previousSnake.length - 1)] || segment;
          const xPosition = previous.x + (segment.x - previous.x) * progress;
          const yPosition = previous.y + (segment.y - previous.y) * progress;
          const inset = index === 0 ? 2 : 2.5;
          const x = xPosition * cellSize + inset;
          const y = yPosition * cellSize + inset;
          const size = cellSize - inset * 2;
          ctx.save();
          if (index === 0) {
            ctx.shadowColor = "#a6ff5f";
            ctx.shadowBlur = 15;
            ctx.fillStyle = "#c2ff85";
          } else {
            const opacity = Math.max(.52, 1 - index / (snake.length * 1.6));
            ctx.fillStyle = `rgba(91, 225, 170, ${opacity})`;
          }
          roundedRect(ctx, x, y, size, size, index === 0 ? 7 : 6);
          ctx.fill();
          ctx.restore();

          if (index === 0) drawEyes(segment);
        });
      }

      function roundedRect(context, x, y, width, height, radius) {
        context.beginPath();
        context.roundRect(x, y, width, height, radius);
      }

      function drawEyes(head) {
        const centerX = head.x * cellSize + cellSize / 2;
        const centerY = head.y * cellSize + cellSize / 2;
        const forwardX = direction.x * 4;
        const forwardY = direction.y * 4;
        const sideX = direction.y * 4;
        const sideY = -direction.x * 4;
        ctx.fillStyle = "#17251a";
        for (const side of [-1, 1]) {
          ctx.beginPath();
          ctx.arc(centerX + forwardX + sideX * side, centerY + forwardY + sideY * side, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      startButton.addEventListener("click", startGame);
      pauseButton.addEventListener("click", togglePause);
      musicButton.addEventListener("click", () => {
        musicEnabled = !musicEnabled;
        updateMusicButton();
        syncMusic();
      });
      document.getElementById("restartButton").addEventListener("click", () => {
        resetBoard();
        startGame();
      });

      document.addEventListener("keydown", (event) => {
        if (keyDirections[event.key]) {
          event.preventDefault();
          setDirection(keyDirections[event.key]);
        } else if (event.code === "Space") {
          event.preventDefault();
          togglePause();
        } else if (event.key === "Escape" && (state === "running" || state === "paused")) {
          event.preventDefault();
          togglePause();
        }
      });

      document.querySelectorAll(".dpad button").forEach((button) => {
        button.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          setDirection(button.dataset.dir);
        });
      });

      const boardWrap = document.getElementById("boardWrap");
      boardWrap.addEventListener("touchstart", (event) => {
        const touch = event.changedTouches[0];
        touchStart = { x: touch.clientX, y: touch.clientY };
      }, { passive: true });
      boardWrap.addEventListener("touchend", (event) => {
        if (!touchStart) return;
        const touch = event.changedTouches[0];
        const deltaX = touch.clientX - touchStart.x;
        const deltaY = touch.clientY - touchStart.y;
        touchStart = null;
        if (Math.max(Math.abs(deltaX), Math.abs(deltaY)) < 18) return;
        setDirection(Math.abs(deltaX) > Math.abs(deltaY)
          ? (deltaX > 0 ? "right" : "left")
          : (deltaY > 0 ? "down" : "up"));
      }, { passive: true });
    })();
  </script>
</body>
</html>
